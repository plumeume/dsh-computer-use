name: ci

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check (JS / MJS / CJS)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path lib, scripts -Recurse -Include *.js, *.mjs, *.cjs -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'no JS files found' }
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax check failed: $($f.Name)" }
          }
          "checked $($files.Count) JS file(s)"
      - name: Parse check (PowerShell drivers)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path scripts -Recurse -Include *.ps1 -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'no PowerShell files found' }
          $errors = @()
          foreach ($f in $files) {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e.Count -gt 0) { $errors += "$($f.Name): $($e[0].Message)" }
          }
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }
          "parsed $($files.Count) PowerShell file(s)"
